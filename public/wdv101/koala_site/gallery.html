  <header id="top">
    <!-- Shared banner and navigation appear on every page. -->
    <h1>Gallery</h1>
    <img src="images/koala_banner.jpg" alt="Koala website banner">
  </header>
  <nav aria-label="Main navigation">
    <ul>
      <li><a href="home.html">Home</a></li>
      <li><a href="about.html">About</a></li>

      <li><a href="adoption.html">Adopt</a></li>
      <li><a href="contact.html">Contact</a></li>
    </ul>
  </nav>
  <main class="koala-gallery" aria-label="Koala photo gallery">
    <figure>
      <img src="images/koala_gallery/ella.jpg" alt="Ella, a koala curled around a branch in profile." width="250" height="250">
      <figcaption>ella.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/grant.jpg" alt="Grant, a koala climbing among green leaves." width="250" height="250">
      <figcaption>grant.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/jams.jpg" alt="Close-up of Jams, a koala beneath eucalyptus leaves." width="250" height="250">
      <figcaption>jams.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/jilley_and_baby.jpg" alt="Jilley with a baby koala riding on her back." width="250" height="250">
      <figcaption>jilley_and_baby.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/koala_c.jpg" alt="A sleeping koala resting its head against a branch." width="250" height="250">
      <figcaption>koala_c.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/lucy.jpg" alt="Lucy, a koala sitting on sand beside the ocean." width="250" height="250">
      <figcaption>lucy.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/miffy.jpg" alt="Miffy, a young koala gripping a tree trunk." width="250" height="250">
      <figcaption>miffy.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/niley.jpg" alt="Niley, a koala looking toward the camera beside a tree." width="250" height="250">
      <figcaption>niley.jpg</figcaption>
    </figure>
    <figure>
      <img src="images/koala_gallery/nooka_and_baby.jpg" alt="Nooka and a baby koala together between branches." width="250" height="250">
      <figcaption>nooka_and_baby.jpg</figcaption>
    </figure>
  </main>
  <footer>
    <p>Copyright 2018 All rights reserved. Australian Koala Foundation</p>
    <img src="images/koala_logo.svg" alt="Australian Koala Foundation logo" width="100">
